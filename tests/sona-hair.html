<!doctype html><meta charset="utf-8"><title>Sona · richer hair colors</title>
<style>body{margin:32px;background:#14141c;color:#ebe5f6;font:14px system-ui}h1{font-size:28px;font-weight:450;margin-bottom:8px}p{color:#b3aabe}.grid{display:grid;grid-template-columns:repeat(4,235px);gap:18px;margin-top:24px}.theme{border:1px solid #ffffff16;border-radius:24px;padding:16px 10px;text-align:center}.pair{display:flex;justify-content:center}canvas{width:106px;height:106px}h2{font-size:15px;font-weight:500;margin:0 0 12px}.label{font-size:12px;color:#d9cfe1}#result{font:12px monospace;color:#afd4bd;margin-top:20px}</style>
<h1>Sona · colored by the music</h1><p>Stronger hair pigments from the visualizer, with the original shading and soft highlights.</p><div class="grid"></div><div id="result">Checking colors…</div>
<script type="module">
import {CompanionRenderer} from '/companion-renderer.js';import {REST_POSE} from '/companion-motion.js';import {interfaceAccents} from '/interface-accent.js';import {companionHairColors,tintCompanionPixels} from '/companion-model.js';import {tintCompanionPixels as previous} from '/sona-previous-tint.js';
const themes=[['Amber',[[.9,.22,.06],[1,.56,.12],[.28,.08,.16]]],['Lagoon',[[.05,.65,.52],[.12,.4,.94],[.1,.72,.8]]],['Rose',[[.82,.08,.44],[.56,.18,.86],[.9,.2,.56]]],['Blue',[[.08,.25,.92],[.06,.65,.88],[.38,.3,.104]]]];
let protectedPixels=0,alphaPixels=0;
for(const [name,palette]of themes){
 const box=document.createElement('section');box.className='theme';box.style.background='radial-gradient(ellipse at 50% 55%,rgba('+palette[0].map(x=>Math.round(x*255)).join(',')+',.28),rgba('+palette[1].map(x=>Math.round(x*255)).join(',')+',.08) 75%)';box.innerHTML='<h2>'+name+'</h2>';const pair=document.createElement('div');pair.className='pair';box.append(pair);document.querySelector('.grid').append(box);
 const old=document.createElement('canvas'),now=document.createElement('canvas');for(const [c,label]of [[old,'Before'],[now,'Now']]){const col=document.createElement('div');col.append(c);const text=document.createElement('div');text.className='label';text.textContent=label;col.append(text);pair.append(col);}old.width=old.height=160;
 const r=new CompanionRenderer(now);await r.load();const data=r.frame(0,0),colors=interfaceAccents(palette),hair=companionHairColors(palette),ctx=old.getContext('2d'),out=ctx.createImageData(160,160);previous(data.data,160,160,colors,out.data);ctx.putImageData(out,0,0);r.draw({row:0,frame:0,pose:REST_POSE},colors,hair);
 // Check every pose for preserved transparency and warm skin with strong pigments.
 for(let row=0;row<13;row++)for(let f=0;f<8;f++){const src=r.frame(row,f).data,dst=tintCompanionPixels(src,160,160,colors,undefined,hair);for(let i=0;i<src.length;i+=4){if(dst[i+3]!==src[i+3])throw Error('Alpha changed');alphaPixels++;if(src[i]>src[i+2]+6&&src[i]>src[i+1]&&src[i+1]>src[i]*.5){if(dst[i]!==src[i]||dst[i+1]!==src[i+1]||dst[i+2]!==src[i+2])throw Error('Skin changed');protectedPixels++;}}}
}
document.querySelector('#result').textContent='Checked all 104 poses in four palettes · warm skin and transparency preserved.';document.querySelector('#result').dataset.status='passed';
</script>
