<!doctype html><meta charset="utf-8"><title>HDR presentation verification</title><style>body{background:#151820;color:#eee;font:16px system-ui;padding:32px}canvas{width:240px;height:100px;border:1px solid #fff3}.hdr-presentation{position:relative}</style><h1>HDR presentation verification</h1><div id="stage"><canvas id="source" width="256" height="8"></canvas></div><pre id="result">Testing…</pre><script type="module">
import {HDROutput} from '/hdr-output.js';
const source=document.querySelector('#source'),ctx=source.getContext('2d');
const output=new HDROutput(source);const report=[];const check=(ok,label)=>{if(!ok)throw Error(label);report.push('PASS · '+label);};
try{
 check(output.update('off')===false,'Off creates no presentation device');
 output.mode='on';await output.prepare();check(output.ready,'Extended-range device and pipeline initialize');
 const config=output.context.getConfiguration();check(config.format==='rgba16float'&&config.toneMapping.mode==='extended','Canvas is actually configured for HDR, not just a bloom buffer');
 // Dark gradient and a 1.35 perceptual highlight, packed as FINISH does.
 for(let x=0;x<256;x++){const value=x===255?1.35:x/254*.3,encoded=value<=1?value*.8:.8+(value-1)*.25,code=Math.round(encoded*255);ctx.fillStyle=`rgb(${code} ${code} ${code})`;ctx.fillRect(x,0,1,8);}
 output.context.configure({...config,usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
 output.device.pushErrorScope('validation');check(output.present(),'A frame reaches the HDR canvas');
 const device=output.device,buffer=device.createBuffer({size:2048*8,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),encoder=device.createCommandEncoder();
 encoder.copyTextureToBuffer({texture:output.context.getCurrentTexture()},{buffer,bytesPerRow:2048},[256,8]);device.queue.submit([encoder.finish()]);await buffer.mapAsync(GPUMapMode.READ);
 const data=new Uint16Array(buffer.getMappedRange()),decode=bits=>{const e=(bits>>10)&31;return e? (1+(bits&1023)/1024)*2**(e-15):(bits&1023)*2**(-24);},value=decode(data[255*4]);
 const dark=Array.from({length:255},(_,x)=>decode(data[x*4]));
 check(new Set(dark).size>55,'Deep gradient retains at least 55 levels instead of broad colour bands');
 check(dark.every((v,x)=>Math.abs(v-x/254*.3)<.004),'Dark ramp round-trips through the real GPU presentation');buffer.unmap();buffer.destroy();
 check(value>1.3&&value<1.4,`Actual float output preserves highlight above SDR white (${value.toFixed(3)})`);
 check(await device.popErrorScope()===null,'GPU reports no validation errors');
 output.update('off');check(!output.ready&&!output.device&&!document.querySelector('.hdr-presentation')&&source.style.opacity==='','Off releases the GPU presentation and restores standard output');
 output.mode='on';const preparing=output.prepare();output.dispose();await preparing;check(!output.ready&&!output.device&&!document.querySelector('.hdr-presentation'),'Disabling during setup leaves no late canvas or device');
 document.querySelector('#result').textContent=report.join('\n');document.querySelector('#result').dataset.status='passed';
}catch(e){output.dispose();document.querySelector('#result').textContent=e.stack;document.querySelector('#result').dataset.status='failed';}
</script>
