<!doctype html><meta charset="utf-8"><title>Playlist review verification</title><style>body{background:#171822;color:white;font:14px system-ui}</style><h1>Playlist review verification</h1><pre id="result">Testing…</pre><div id="entries"></div><script type="module">
import {syncEntryMarkup,installSyncReview} from '/sync-review.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const duration=s=>`${Math.floor((s||0)/60)}:${String(Math.floor((s||0)%60)).padStart(2,'0')}`;
const local={id:'local',title:'Song',artist:'Artist',duration:180,rawTitle:'Artist - Song',format:'opus',available:true};
const entries=[{sourceId:'s',id:'abcdefghijk',title:'Song (Live) <tag>',channel:'Artist',duration:217,status:'review',trackId:'local'},{sourceId:'s',id:'lmnopqrstuv',title:'New song',channel:'Artist',duration:180,status:'new'},{sourceId:'s',id:'qwertyuiopa',spotifyId:'spotify',provider:'spotify',title:'Spotify song',duration:180,channel:'Artist',status:'review',candidates:[{id:'qwertyuiopa',title:'YouTube version',duration:180,channel:'Artist',score:95},{id:'zxcvbnmasdf',title:'Other version',duration:190,channel:'Artist',score:80}]}];
const root=document.querySelector('#entries');root.innerHTML=entries.map((e,i)=>syncEntryMarkup(e,local,{name:'Test'},i,{esc,duration})).join('');const ui=installSyncReview({entries:()=>entries,getTrack:()=>local,esc,duration,root});const report=[],check=(ok,label)=>{if(!ok)throw Error(label);report.push('PASS · '+label);};
try{
 const row=root.querySelector('.sync-entry'),button=row.querySelector('[data-sync-review]'),panel=row.querySelector('.sync-review-panel'),checkbox=row.querySelector('input');
 check(!checkbox.checked,'Possible duplicates are not selected automatically');button.click();check(!panel.hidden&&button.getAttribute('aria-expanded')==='true','Review opens an accessible comparison');check(panel.textContent.includes('37 s longer')&&panel.textContent.includes('Artist - Song'),'Comparison shows the local version and duration difference');check(!root.querySelector('tag'),'Playlist labels are escaped');
 panel.querySelector('[data-sync-choice=download]').click();check(checkbox.checked&&panel.querySelector('[data-review-decision]').textContent.includes('Selected.'),'Selecting marks only that recording for download');panel.querySelector('[data-sync-choice=skip]').click();check(!checkbox.checked&&root.querySelectorAll('input')[1].checked,'Leaving unchecked preserves other selections');button.click();check(panel.hidden&&button.getAttribute('aria-expanded')==='false','Review closes without discarding selections');
 const spotify=root.querySelectorAll('.sync-entry')[2];spotify.querySelector('[data-sync-review]').click();check(spotify.querySelector('.sync-review-panel').textContent.includes('YouTube version'),'Spotify review opens the chosen YouTube candidate');entries[2].id='zxcvbnmasdf';ui.refresh(spotify);check(spotify.querySelector('.sync-review-panel').textContent.includes('Other version'),'Changing a Spotify match updates the open comparison');
 document.querySelector('#result').textContent=report.join('\n');document.querySelector('#result').dataset.status='passed';
}catch(e){document.querySelector('#result').textContent=e.stack;document.querySelector('#result').dataset.status='failed';}
</script>
