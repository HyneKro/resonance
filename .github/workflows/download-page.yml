name: Publish download page

on:
  push:
    branches: [main]
    paths:
      - download-page/**
      - scripts/build-download-page.mjs
      - tests/download-page.test.mjs
      - electron/github-releases.cjs
      - public/brand.js
      - public/icon.svg
      - .github/workflows/download-page.yml
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: download-page
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'development-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Release events can point at older app tags. Always deploy current page source.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/download-page.test.mjs
      - name: Resolve the latest published app downloads
        run: node scripts/build-download-page.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: download-page/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the download page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
