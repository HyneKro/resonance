name: Report a problem
description: Help improve playback, visuals, the library or updates.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Resonance. Remove personal names, file paths and playlist links from screenshots or diagnostics. Do not attach a library database, cookies or credentials."
  - type: input
    id: version
    attributes:
      label: App version
      description: Find this in Settings → App updates.
      placeholder: "Windows 1.x.x or Android 0.x.x-preview"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Website
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Steps, the affected mode, and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Optional details
      description: Operating-system version, relevant hardware model or a sanitized screenshot. No device serial numbers or personal information.
