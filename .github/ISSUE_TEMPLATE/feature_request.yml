name: Suggest an improvement
description: A better listening experience, a clearer interaction or a new idea.
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the listening experience or problem first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Mention Windows, Android or both if relevant.
    validations:
      required: true
