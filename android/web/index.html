<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100e18"><title>Resonance</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/mobile.css"><link rel="stylesheet" href="/song-analysis.css">
<link rel="stylesheet" href="/menu-layout.css"><link rel="stylesheet" href="/constellation.css"><link rel="stylesheet" href="/listening-modes.css"></head>
<body>
<section id="listening-room" aria-label="Listening room">
 <canvas id="room-gl" aria-label="Live musical sculpture and nebula"></canvas><canvas id="room-canvas" hidden></canvas>
 <div id="music-wallpaper" aria-hidden="true"><i></i><i></i><i></i><div class="grooves"></div></div>
 <header class="room-top"><div class="brand"><img src="/icon.svg" alt=""><span>resonance.</span></div><button id="library" class="text">Library</button><button type="button" class="update-ready-button" data-update-ready hidden aria-label="Update ready"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span>Update ready</span></button><button id="settings" class="text" aria-label="Settings">Settings</button></header><nav class="listening-modes mobile-modes" aria-label="Listening mode"><button id="visualizer-mode" data-listening-mode="visualizer" aria-pressed="true">Visualizer</button><button id="map-mode" data-listening-mode="constellation" aria-pressed="false">Constellation</button><button id="music-only" data-listening-mode="music" aria-pressed="false">Music only</button></nav><div class="mobile-mode-tools" data-visualizer-only><button id="immerse" class="text" data-action="immerse" aria-pressed="false">Immerse</button><button id="visuals" class="text">Visuals & Sona</button></div>
 <section id="welcome" hidden><span class="eyebrow">YOUR POCKET UNIVERSE</span><h1>Bring your<br>music along.</h1><p>Your collection. Your colors.<br>A little space to get lost in.</p><button class="primary" data-action="online">Download a playlist</button><button class="secondary" data-action="folder">Add existing music</button><button class="text" data-action="sync">View downloads</button></section>
 <section id="music-only-stage" aria-label="Now playing"><button id="cover-play" aria-label="Play or pause"><span id="music-only-cover"></span></button><span class="eyebrow">JUST THE MUSIC</span><h1 id="music-only-title"></h1><p id="music-only-artist"></p><p class="music-stage-note"><span class="music-stage-idle">Original sound. A moment to yourself.</span><span id="visualizer-loading" role="status" aria-live="polite" hidden><i aria-hidden="true"></i><span data-loading-label></span></span></p></section>
 <div class="room-dock"><div id="playback-problem" class="playback-problem" role="alert" hidden><p id="playback-problem-message"></p><div><button class="secondary" data-action="playback-retry">Try again</button><button class="text" data-action="playback-details">Playback details</button></div></div><div class="now-row"><button id="track-details" class="track-details" aria-label="Track details"><span id="now-art"></span><span><strong id="now-title">Find your frequency</strong><small id="now-artist">Your music, wherever you are</small></span></button><button id="favorite" class="round favorite" aria-label="Favorite" aria-pressed="false">♡</button></div>
 <div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek music"><div><time id="elapsed">0:00</time><span id="playback-status" role="status"></span><time id="duration">0:00</time></div></div>
 <div class="transport"><button id="shuffle" class="round" aria-label="Shuffle" aria-pressed="false">⤨</button><button id="previous" class="round" aria-label="Previous track">Ⅰ◀</button><button id="play" class="play" aria-label="Play">▶</button><button id="next" class="round" aria-label="Next track">▶Ⅰ</button><button id="repeat" class="round" aria-label="Repeat track" aria-pressed="false">↻</button></div>
 <div class="volume-row"><span aria-hidden="true">◖</span><input id="volume" type="range" min="0" max="100" step="0.1" value="100" aria-label="Music volume"><button id="volume-value" class="text" aria-label="Set exact volume">100%</button></div>
 <nav class="bottom-nav" aria-label="Playback"><button id="queue">☰<span>Queue</span></button></nav></div>
</section>
<dialog id="sheet"><header><button id="sheet-back" class="round" aria-label="Go back">‹</button><h2 id="sheet-title"></h2><button id="sheet-close" class="round" aria-label="Close panel">×</button></header><div id="sheet-body"></div></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="opening"><img src="/icon.svg" alt=""><span>resonance.</span><p>Making room for your music</p></div>
<script type="module" src="/mobile.js"></script>
</body></html>
