plugins { id 'com.android.application' }

android {
    namespace 'music.resonance.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'music.resonance.mobile'
        minSdk 29
        targetSdk 35
        versionCode 85
        versionName '0.26.0-dev.19'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] } }
    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/webAssets')]
    lint { abortOnError true }
}

tasks.register('prepareWebAssets', Copy) {
    from('../shared') {
        exclude 'index.html', 'app.js', 'icon.ico', 'startup.html'
    }
    into(layout.buildDirectory.dir('generated/webAssets/web'))
}
tasks.register('prepareMobileAssets', Copy) {
    dependsOn 'prepareWebAssets'
    from('../web')
    into(layout.buildDirectory.dir('generated/webAssets/web'))
}
tasks.register('prepareSkyboxAsset') {
    dependsOn 'prepareMobileAssets'
    def panorama = rootProject.file('../.private/skybox/mobile.webp')
    def fallback = rootProject.file('shared/constellation-sky-texture.js')
    def output = layout.buildDirectory.file('generated/webAssets/web/constellation-sky-texture.js')
    // Always regenerate after Copy: removing the private asset must also remove
    // the embedded rendition from the next public-source build.
    doLast {
        if (panorama.exists()) {
            byte[] bytes = panorama.bytes
            if (bytes.length > 4000000 || new String(bytes, 0, 4, 'US-ASCII') != 'RIFF' || new String(bytes, 8, 4, 'US-ASCII') != 'WEBP') throw new GradleException('Expected an optimized WebP panorama under 4 MB')
            output.get().asFile.text = '// Space Skybox Collection 4 by Makemake. Licensed for use within Resonance only.\nexport const skyTexture = "data:image/webp;base64,' + bytes.encodeBase64().toString() + '";\n'
        } else output.get().asFile.text = fallback.getText('UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareSkyboxAsset' }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
